<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04080F"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#f5d06a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#1a2a3d" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#1a2a3d" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#1a2a3d" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#1a2a3d" stroke-width="1"/>
  <!-- Bar chart icon -->
  <rect x="88"  y="360" width="32" height="120" rx="6" fill="#ef4444" opacity=".9"/>
  <rect x="136" y="290" width="32" height="190" rx="6" fill="#8bafd1" opacity=".9"/>
  <rect x="184" y="320" width="32" height="160" rx="6" fill="#60a5fa" opacity=".9"/>
  <rect x="232" y="210" width="32" height="270" rx="6" fill="#3b82f6" opacity=".9"/>
  <rect x="280" y="260" width="32" height="220" rx="6" fill="#22c55e" opacity=".9"/>
  <!-- Gold accent line -->
  <rect x="80" y="160" width="240" height="3" rx="1.5" fill="url(#gold)"/>
  <!-- Brand name -->
  <text x="88" y="130" font-family="Georgia,serif" font-size="64" font-weight="900" fill="#E2EAF4" letter-spacing="-1">FOREX DESK</text>
  <text x="90" y="160" font-family="monospace" font-size="18" fill="#c9a84c" letter-spacing="4">GOLD · FOREX · MARKETS</text>
  <!-- Tagline -->
  <text x="88" y="530" font-family="monospace" font-size="22" fill="#8bafd1">Professional trading command center</text>
  <text x="88" y="565" font-family="monospace" font-size="18" fill="#4a6a8a">Live prices · Journal · Portfolio · Calendar · News</text>
  <!-- Right side stats decoration -->
  <rect x="820" y="80"  width="300" height="60" rx="10" fill="#0f1a28" stroke="#1a2a3d" stroke-width="1"/>
  <text x="840" y="118" font-family="monospace" font-size="14" fill="#8bafd1">XAU/USD</text>
  <text x="1020" y="118" font-family="monospace" font-size="20" font-weight="700" fill="#c9a84c">3,342.50</text>
  <rect x="820" y="160" width="300" height="60" rx="10" fill="#0f1a28" stroke="#1a2a3d" stroke-width="1"/>
  <text x="840" y="198" font-family="monospace" font-size="14" fill="#8bafd1">EUR/USD</text>
  <text x="1020" y="198" font-family="monospace" font-size="20" font-weight="700" fill="#22c55e">1.0892</text>
  <rect x="820" y="240" width="300" height="60" rx="10" fill="#0f1a28" stroke="#1a2a3d" stroke-width="1"/>
  <text x="840" y="278" font-family="monospace" font-size="14" fill="#8bafd1">DXY</text>
  <text x="1020" y="278" font-family="monospace" font-size="20" font-weight="700" fill="#ef4444">104.23</text>
  <rect x="820" y="320" width="300" height="60" rx="10" fill="#0f1a28" stroke="#1a2a3d" stroke-width="1"/>
  <text x="840" y="358" font-family="monospace" font-size="14" fill="#8bafd1">BTC/USD</text>
  <text x="1020" y="358" font-family="monospace" font-size="20" font-weight="700" fill="#60a5fa">67,450</text>
</svg>
