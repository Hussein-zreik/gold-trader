<style>
/* ════════════════════════════════════════════
   ECONOMIC CALENDAR — Linear / Modern redesign
   Canvas #050506 · glass surfaces · indigo accent #5E6AD2
   NOTE: every class name the JS toggles/queries/emits is
   preserved verbatim — only the CSS is restyled.
   ════════════════════════════════════════════ */

:root {
  --cal-accent: #5E6AD2;
  --cal-accent-hover: #6872D9;
  --cal-glass: linear-gradient(to bottom, rgba(255,255,255,.055), rgba(255,255,255,.02));
  --cal-glass-soft: linear-gradient(to bottom, rgba(255,255,255,.035), rgba(255,255,255,.012));
  --cal-hair: rgba(255,255,255,.06);
  --cal-hair-strong: rgba(255,255,255,.10);
  --cal-accent-border: rgba(94,106,210,.30);
  --cal-accent-tint: rgba(94,106,210,.12);
  --cal-glow: rgba(94,106,210,.30);
  --cal-red: #ef4444;
  --cal-orange: #f97316;
  --cal-green: #22c55e;
  --cal-purple: #a855f7;
  --cal-ease: cubic-bezier(.16,1,.3,1);
}

/* ── PAGE LAYOUT ── */
.cal-page { max-width: 1100px; margin: 0 auto; padding: 40px 24px 72px; }
.cal-title {
  font-family: var(--display);
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -.02em;
  line-height: 1.1;
  margin-bottom: 10px;
  background: linear-gradient(180deg, #fff 0%, rgba(237,237,239,.70) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.cal-subtitle { font-family: var(--sans); font-size: 14px; color: var(--muted); margin-bottom: 30px; line-height: 1.6; max-width: 620px; }

/* ── MAIN CARD (glass, deepened) ── */
.cal-card {
  border: none;
  border-radius: 16px;
  overflow: hidden;
  background: var(--cal-glass);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.06),
    0 2px 20px rgba(0,0,0,.4),
    0 0 40px rgba(0,0,0,.2);
}

/* ── TOOLBAR ── */
.cal-toolbar {
  display: flex;
  align-items: center;
  padding: 14px 18px;
  border-bottom: 1px solid var(--cal-hair);
  background: var(--cal-glass-soft);
  flex-wrap: wrap;
  gap: 12px;
}

.cal-nav-links {
  display: flex;
  align-items: center;
  gap: 2px;
  flex-wrap: wrap;
}

/* Nav links = ghost pills */
.cal-nav-link {
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 6px 12px;
  border-radius: 9999px;
  transition: color .2s var(--cal-ease), background .2s var(--cal-ease);
  white-space: nowrap;
}
.cal-nav-link:hover { color: var(--text); background: rgba(255,255,255,.05); }
.cal-nav-link.active {
  color: var(--cal-accent-hover);
  font-weight: 600;
  background: var(--cal-accent-tint);
}

/* Hide the legacy text separators — pills space themselves */
.cal-sep { display: none; }
.cal-nav-divider { width: 1px; height: 18px; background: var(--cal-hair-strong); margin: 0 6px; flex-shrink: 0; }

.cal-toolbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.cal-tz {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  background: rgba(255,255,255,.03);
  border: 1px solid var(--cal-hair);
  border-radius: 9999px;
  padding: 6px 12px;
  white-space: nowrap;
}

/* View buttons = segmented control */
.cal-view-btns {
  display: inline-flex;
  padding: 3px;
  background: rgba(255,255,255,.03);
  border: 1px solid var(--cal-hair);
  border-radius: 9999px;
  gap: 2px;
}
.cal-view-btn {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  padding: 5px 14px;
  background: transparent;
  border: none;
  border-radius: 9999px;
  color: var(--muted);
  cursor: pointer;
  transition: all .2s var(--cal-ease);
  letter-spacing: .5px;
}
.cal-view-btn + .cal-view-btn { border-left: none; }
.cal-view-btn:hover { color: var(--text); }
.cal-view-btn.active {
  background: var(--cal-accent-tint);
  color: var(--cal-accent-hover);
  box-shadow: inset 0 0 0 1px var(--cal-accent-border);
}

/* Filter toggle pill */
.cal-filter-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  padding: 7px 14px;
  background: rgba(255,255,255,.03);
  border: 1px solid var(--cal-hair);
  border-radius: 9999px;
  color: var(--muted);
  cursor: pointer;
  transition: all .2s var(--cal-ease);
  letter-spacing: .5px;
}
.cal-filter-btn:hover { border-color: var(--cal-hair-strong); color: var(--text); }

/* ── DATE STRIP ── */
.date-strip-bar {
  background: var(--cal-glass-soft);
  border-bottom: 1px solid var(--cal-hair);
  padding: 6px 10px;
  display: flex;
  align-items: center;
  gap: 4px;
  min-height: 92px;
}

.strip-arrow {
  width: 34px;
  height: 34px;
  border-radius: 9999px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--cal-hair);
  color: var(--text);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background .2s var(--cal-ease), border-color .2s var(--cal-ease);
}
.strip-arrow:hover { background: rgba(255,255,255,.08); border-color: var(--cal-hair-strong); }

.date-strip {
  display: flex;
  flex: 1;
  overflow: hidden;
  gap: 2px;
}

.date-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 6px;
  cursor: pointer;
  border-radius: 12px;
  transition: background .2s var(--cal-ease), box-shadow .2s var(--cal-ease);
  min-width: 0;
  position: relative;
}
.date-col:hover { background: rgba(255,255,255,.04); }
.date-col.active {
  background: var(--cal-accent-tint);
  box-shadow: inset 0 0 0 1px var(--cal-accent-border);
}
.date-col.weekend { opacity: .45; }

.date-col-month { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 5px; }
.date-col-num   { font-family: var(--display); font-size: 26px; font-weight: 800; color: var(--text); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.date-col-day   { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 5px; }
.date-col.active .date-col-num { color: var(--cal-accent-hover); }
.date-col.today-col .date-col-day { color: var(--cal-accent-hover); }

/* Today pill = accent-tinted glowing pill */
.date-col-today-pill {
  background: var(--cal-accent-tint);
  color: var(--cal-accent-hover);
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 9999px;
  margin-top: 5px;
  letter-spacing: .5px;
  box-shadow: inset 0 0 0 1px var(--cal-accent-border), 0 0 12px var(--cal-glow);
}

.date-dots { display: flex; gap: 3px; margin-top: 6px; min-height: 7px; justify-content: center; }
.date-dot  { width: 5px; height: 5px; border-radius: 50%; }
.date-dot.high { background: var(--cal-red); }
.date-dot.med  { background: var(--cal-orange); }
.date-dot.low  { background: var(--muted); }

/* ── DAY HEADER ── */
.day-section { border-bottom: 1px solid var(--cal-hair); }
.day-section:last-child { border-bottom: none; }

.day-header-row {
  display: grid;
  grid-template-columns: 90px 1fr 100px 110px 110px 110px;
  background: rgba(255,255,255,.02);
  border-bottom: 1px solid var(--cal-hair);
  padding: 16px 20px;
  align-items: center;
  gap: 0;
}

.day-header-date-block {
  display: flex;
  flex-direction: column;
  line-height: 1;
}
.day-header-month-lbl { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; }
.day-header-day-num   { font-family: var(--display); font-size: 34px; font-weight: 800; color: var(--text); line-height: 1; margin-top: 3px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

.day-header-name { font-family: var(--display); font-size: 19px; font-weight: 700; color: var(--text); padding-left: 16px; border-left: 1px solid var(--cal-hair-strong); margin-left: 4px; letter-spacing: -.01em; }

.day-col-hdr {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
  color: var(--muted);
  text-transform: uppercase;
  text-align: right;
}

/* ── EVENT ROW ── */
.evt-row {
  display: grid;
  grid-template-columns: 90px 70px 1fr 100px 110px 110px 110px;
  padding: 0 20px;
  align-items: center;
  min-height: 54px;
  border-bottom: 1px solid var(--cal-hair);
  border-left: 3px solid transparent;
  transition: background .2s var(--cal-ease);
  gap: 0;
}
.evt-row:last-child { border-bottom: none; }
.evt-row:hover { background: rgba(255,255,255,.03); }
.evt-row.high-row { border-left: 3px solid var(--cal-red); padding-left: 17px; }
.evt-row.med-row  { border-left: 3px solid var(--cal-orange); padding-left: 17px; }
.evt-row.cb-row   { border-left: 3px solid var(--cal-purple); padding-left: 17px; background: rgba(168,85,247,.04); }

.evt-time { font-family: var(--mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.evt-flag-cur { display: flex; align-items: center; gap: 6px; }
.evt-flag { font-size: 15px; }
.evt-cur  { font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: .5px; }
.evt-name { font-family: var(--sans); font-size: 12.5px; font-weight: 500; color: var(--text); padding: 0 12px; line-height: 1.4; }
.evt-name.cb-name { color: #c084fc; }

/* Impact dot = small filled indicator */
.imp-dot {
  width: 9px; height: 9px; border-radius: 50%; display: inline-block;
  margin-right: 6px; flex-shrink: 0;
}
.imp-dot.high { background: var(--cal-red); box-shadow: 0 0 6px rgba(239,68,68,.55); }
.imp-dot.med  { background: var(--cal-orange); box-shadow: 0 0 5px rgba(249,115,22,.45); }
.imp-dot.low  { background: var(--muted); }
.imp-dot.cb   { background: var(--cal-purple); box-shadow: 0 0 6px rgba(168,85,247,.45); }

.evt-impact-cell { display: flex; align-items: center; }

.evt-num {
  font-family: var(--mono);
  font-size: 11px;
  text-align: right;
  padding-right: 4px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.evt-num.actual   { color: var(--text); font-weight: 600; }
.evt-num.better   { color: var(--cal-green); font-weight: 600; }
.evt-num.worse    { color: #f87171; font-weight: 600; }
.evt-num.empty    { color: rgba(255,255,255,.15); }

/* ── STATUS / EMPTY ── */
.cal-status-bar {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  padding: 9px 20px;
  background: rgba(255,255,255,.02);
  border-bottom: 1px solid var(--cal-hair);
  display: flex;
  align-items: center;
  gap: 9px;
  letter-spacing: .3px;
}
.cal-status-bar.error { color: #f87171; }
.cal-status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--cal-green);
  box-shadow: 0 0 8px rgba(34,197,94,.6);
  animation: 2s ease-in-out infinite pulse;
  flex-shrink: 0;
}
.cal-status-bar.error .cal-status-dot { background: #f87171; box-shadow: 0 0 8px rgba(248,113,113,.6); }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }

.cal-empty {
  padding: 64px 20px;
  text-align: center;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--muted);
}
.cal-loading-spin {
  display: inline-block;
  font-size: 24px;
  color: var(--cal-accent);
  animation: 1s linear infinite spin;
  margin-bottom: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── CHECKBOX ROW (.cb-row) — custom accent checkbox styling ── */
.cb-row input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 4px;
  border: 1px solid var(--cal-hair-strong);
  background: rgba(255,255,255,.03);
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
  transition: background .2s var(--cal-ease), border-color .2s var(--cal-ease);
}
.cb-row input[type="checkbox"]:hover { border-color: var(--cal-accent-border); }
.cb-row input[type="checkbox"]:checked {
  background: var(--cal-accent);
  border-color: var(--cal-accent);
}
.cb-row input[type="checkbox"]:checked::after {
  content: "";
  position: absolute;
  left: 5px; top: 2px;
  width: 4px; height: 8px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

/* ── ENTRANCE (single card fade-up) ── */
.cal-card { will-change: transform, opacity; }
.cal-reveal { opacity: 0; transform: translateY(16px); }
.cal-reveal.cal-revealed {
  opacity: 1;
  transform: translateY(0);
  transition: opacity .5s cubic-bezier(.19,1,.22,1), transform .5s cubic-bezier(.19,1,.22,1);
}

/* ── FOCUS-VISIBLE (a11y) ── */
.cal-nav-link:focus-visible,
.cal-view-btn:focus-visible,
.cal-filter-btn:focus-visible,
.strip-arrow:focus-visible,
.date-col:focus-visible,
.cb-row input[type="checkbox"]:focus-visible {
  outline: 2px solid rgba(94,106,210,.6);
  outline-offset: 2px;
}

/* ── MOBILE ── */
@media (max-width: 700px) {
  .cal-page { padding: 24px 12px 48px; }
  .cal-title { font-size: 26px; }
  .day-header-row { grid-template-columns: 70px 1fr; gap: 0; padding: 14px; }
  .day-col-hdr { display: none; }
  .evt-row { grid-template-columns: 64px 52px 1fr 80px; padding: 0 14px; }
  .evt-row.high-row, .evt-row.med-row, .evt-row.cb-row { padding-left: 11px; }
  .evt-num.hide-m { display: none; }
  .cal-toolbar { padding: 10px 14px; gap: 8px; }
  .date-col-num { font-size: 20px; }
  .day-header-day-num { font-size: 28px; }
  .evt-name { padding: 0 8px; font-size: 11px; }
}

/* ── REDUCED MOTION ── */
@media (prefers-reduced-motion: reduce) {
  .cal-reveal, .cal-reveal.cal-revealed { opacity: 1 !important; transform: none !important; transition: none !important; }
  .cal-status-dot, .cal-loading-spin { animation: none !important; }
  .cal-card { will-change: auto; }
  * { scroll-behavior: auto !important; }
}

/* ── LIGHT MODE ── */

/* Page header — .cal-title is the actual class used in this page */
body.light-mode .cal-title { background-image: linear-gradient(to bottom,#09090B,rgba(9,9,11,.70)) !important; -webkit-background-clip:text !important; background-clip:text !important; -webkit-text-fill-color:transparent !important; color:transparent !important; }
body.light-mode .cal-subtitle,
body.light-mode .page-sub { color: #52525B !important; }

/* Calendar card */
body.light-mode .cal-card { background: #FFFFFF !important; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 2px 20px rgba(0,0,0,.08) !important; }
body.light-mode .cal-toolbar { background: rgba(0,0,0,.02) !important; border-bottom-color: rgba(0,0,0,.06) !important; }

/* Nav links */
body.light-mode .cal-nav-link { color: #52525B !important; }
body.light-mode .cal-nav-link:hover { color: #09090B !important; background: rgba(0,0,0,.04) !important; }
body.light-mode .cal-nav-link.active { color: #4F46E5 !important; background: rgba(79,70,229,.08) !important; }
body.light-mode .cal-nav-divider,
body.light-mode .cal-sep { color: rgba(0,0,0,.12) !important; background: rgba(0,0,0,.12) !important; }

/* View buttons (segmented control) */
body.light-mode .cal-view-btns { background: rgba(0,0,0,.05) !important; border-color: rgba(0,0,0,.08) !important; }
body.light-mode .cal-view-btn { color: #52525B !important; }
body.light-mode .cal-view-btn:hover { background: rgba(0,0,0,.05) !important; color: #09090B !important; }
body.light-mode .cal-view-btn.active { background: #FFFFFF !important; color: #4F46E5 !important; box-shadow: 0 0 0 1px rgba(79,70,229,.20),inset 0 0 0 2px rgba(79,70,229,.12) !important; }

/* Filter buttons */
body.light-mode .cal-filter-btn { background: rgba(0,0,0,.04) !important; border-color: rgba(0,0,0,.08) !important; color: #52525B !important; }
body.light-mode .cal-filter-btn:hover { background: rgba(0,0,0,.07) !important; color: #09090B !important; }
body.light-mode .cal-filter-btn.active { background: rgba(79,70,229,.10) !important; border-color: rgba(79,70,229,.25) !important; color: #4F46E5 !important; }

/* Timezone pill */
body.light-mode .cal-tz { background: rgba(0,0,0,.03) !important; border-color: rgba(0,0,0,.08) !important; color: #52525B !important; }

/* Status bar */
body.light-mode .cal-status-bar { background: rgba(0,0,0,.03) !important; border-bottom-color: rgba(0,0,0,.06) !important; color: #52525B !important; }
body.light-mode .cal-status-bar.error { color: #DC2626 !important; }
body.light-mode #calStatusText,
body.light-mode .cal-status-text { color: #52525B !important; }
body.light-mode .cal-status-dot { background: #A1A1AA !important; box-shadow: none !important; }
body.light-mode .cal-status-bar.live .cal-status-dot { background: #16A34A !important; box-shadow: 0 0 6px rgba(22,163,74,.6) !important; }
body.light-mode .cal-status-bar.error .cal-status-dot { background: #DC2626 !important; box-shadow: 0 0 6px rgba(220,38,38,.6) !important; }

/* Date strip bar + arrows */
body.light-mode .date-strip-bar { background: rgba(0,0,0,.02) !important; border-bottom-color: rgba(0,0,0,.06) !important; }
body.light-mode .strip-arrow { background: rgba(0,0,0,.04) !important; border-color: rgba(0,0,0,.08) !important; color: #09090B !important; }
body.light-mode .strip-arrow:hover { background: rgba(0,0,0,.08) !important; border-color: rgba(0,0,0,.14) !important; }

/* Date strip */
body.light-mode .date-strip,
body.light-mode #dateStrip { border-bottom-color: rgba(0,0,0,.06) !important; background: rgba(0,0,0,.02) !important; }
body.light-mode .date-col { color: #52525B !important; }
body.light-mode .date-col:hover { background: rgba(0,0,0,.04) !important; }
body.light-mode .date-col.active { background: rgba(79,70,229,.08) !important; box-shadow: inset 0 0 0 1px rgba(79,70,229,.20) !important; }
body.light-mode .date-col.weekend { opacity: .55 !important; }
body.light-mode .date-col-month { color: #52525B !important; }
body.light-mode .date-col-num { color: #09090B !important; }
body.light-mode .date-col-day { color: #71717A !important; }

</style>
</head>
<body>
<main id="main-content">
<div class="cal-page">
  <div class="cal-title">Economic Calendar</div>
  <div class="cal-subtitle">Your trading companion for economic event risk. High-impact events move gold and forex markets instantly — don't get caught off-guard.</div>

  <div class="cal-card cal-reveal">

    <!-- ── TOOLBAR ── -->
    <div class="cal-toolbar">
      <div class="cal-nav-links">
        <button class="cal-nav-link" onclick="quickNav('yesterday',this)">Yesterday</button>
        <button class="cal-nav-link active" onclick="quickNav('today',this)">Today</button>
        <button class="cal-nav-link" onclick="quickNav('tomorrow',this)">Tomorrow</button>
        <span class="cal-nav-divider" aria-hidden="true"></span>
        <button class="cal-nav-link" onclick="loadPeriod('last',this)">Last Week</button>
        <button class="cal-nav-link" onclick="loadPeriod('this',this)">This Week</button>
        <button class="cal-nav-link" onclick="loadPeriod('next',this)">Next Week</button>
      </div>
      <div class="cal-toolbar-right">
        <div class="cal-tz">🕐 <span id="calTzLabel">GMT+0</span> · <span id="calClock">--:--</span></div>
        <div class="cal-view-btns">
          <button class="cal-view-btn" onclick="setView('week',this)">Week</button>
          <button class="cal-view-btn active" onclick="setView('day',this)">Day</button>
        </div>
        <button class="cal-filter-btn" onclick="toggleFilterPanel()">▼ Filters</button>
      </div>
    </div>

    <!-- ── FILTER PANEL (hidden by default) ── -->
    <div id="filterPanel" style="display:none;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--bg3);display:none;">
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted2);margin-bottom:8px;letter-spacing:1px;">SHOW IMPACT LEVELS:</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="cal-nav-link active" style="border:1px solid rgba(239,68,68,.4);color:#f87171;" onclick="toggleImpact('high',this)" data-impact="high">● HIGH</button>
        <button class="cal-nav-link active" style="border:1px solid rgba(249,115,22,.4);color:#f97316;" onclick="toggleImpact('med',this)" data-impact="med">● MEDIUM</button>
        <button class="cal-nav-link" style="border:1px solid var(--border);" onclick="toggleImpact('low',this)" data-impact="low">● LOW</button>
        <button class="cal-nav-link active" style="border:1px solid rgba(168,85,247,.4);color:#c084fc;" onclick="toggleImpact('cb',this)" data-impact="cb">● CB MEETINGS</button>
      </div>
    </div>

    <!-- ── STATUS ── -->
    <div class="cal-status-bar" id="calStatusBar">
      <div class="cal-status-dot"></div>
      <span id="calStatusText">Loading calendar…</span>
      <span style="margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.5px;">ALL TIMES UTC</span>
    </div>

    <!-- ── DATE STRIP ── -->
    <div class="date-strip-bar">
      <button class="strip-arrow" onclick="shiftWeek(-1)">&#8249;</button>
      <div class="date-strip" id="dateStrip"></div>
      <button class="strip-arrow" onclick="shiftWeek(1)">&#8250;</button>
    </div>

    <!-- ── EVENTS ── -->
    <div id="calEvents">
      <div class="cal-empty"><div class="cal-loading-spin">⟳</div><br>Fetching live events…</div>
    </div>

  </div>
</div>
</main>

<script src="shared.js" defer></script>
<script>
// ── STATE ──
const FX_PROXY = 'https://forex-desk-proxy.zreik111.workers.dev/?url=';
const FF_BASE  = 'https://nfs.faireconomy.media/ff_calendar_';
const CAL_TTL  = 15*60*1000;
const DAYS     = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS   = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHSL  = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const FLAGS    = {USD:'🇺🇸',EUR:'🇪🇺',GBP:'🇬🇧',JPY:'🇯🇵',AUD:'🇦🇺',CAD:'🇨🇦',CHF:'🇨🇭',NZD:'🇳🇿',CNY:'🇨🇳',KRW:'🇰🇷',SGD:'🇸🇬',HKD:'🇭🇰'};

let allEvents    = [];
let activeImpact = new Set(['high','med','cb']);
let selectedDate = null;
let currentView  = 'day';
let weekOffset   = 0;  // 0=this, -1=last, +1=next

// ── CB MEETINGS as events ──
const CB_EVENTS = [
  {date:'2026-06-17T00:00:00',currency:'USD',title:'Federal Reserve (FOMC) — Rate Decision + Dot Plot',impact:'cb'},
  {date:'2026-06-17T00:00:00',currency:'JPY',title:'Bank of Japan (BOJ) — Policy Rate Decision',impact:'cb'},
  {date:'2026-07-22T00:00:00',currency:'EUR',title:'European Central Bank (ECB) — Rate Decision',impact:'cb'},
  {date:'2026-07-28T00:00:00',currency:'USD',title:'Federal Reserve (FOMC) — Rate Decision',impact:'cb'},
  {date:'2026-07-30T00:00:00',currency:'JPY',title:'Bank of Japan (BOJ) — Policy Rate Decision',impact:'cb'},
  {date:'2026-08-04T00:00:00',currency:'AUD',title:'Reserve Bank of Australia (RBA) — Cash Rate Decision',impact:'cb'},
  {date:'2026-08-06T00:00:00',currency:'GBP',title:'Bank of England (BOE) — MPC Decision + MPR',impact:'cb'},
  {date:'2026-09-09T00:00:00',currency:'EUR',title:'European Central Bank (ECB) — Rate Decision',impact:'cb'},
  {date:'2026-09-15T00:00:00',currency:'AUD',title:'Reserve Bank of Australia (RBA) — Cash Rate Decision',impact:'cb'},
  {date:'2026-09-16T00:00:00',currency:'USD',title:'Federal Reserve (FOMC) — Rate Decision + Dot Plot',impact:'cb'},
  {date:'2026-10-29T00:00:00',currency:'USD',title:'Federal Reserve (FOMC) — Rate Decision',impact:'cb'},
  {date:'2026-10-29T00:00:00',currency:'EUR',title:'European Central Bank (ECB) — Rate Decision',impact:'cb'},
  {date:'2026-11-05T00:00:00',currency:'GBP',title:'Bank of England (BOE) — MPC Decision',impact:'cb'},
  {date:'2026-12-16T00:00:00',currency:'USD',title:'Federal Reserve (FOMC) — Rate Decision + Dot Plot',impact:'cb'},
  {date:'2026-12-17T00:00:00',currency:'GBP',title:'Bank of England (BOE) — MPC Decision',impact:'cb'},
  {date:'2026-12-18T00:00:00',currency:'JPY',title:'Bank of Japan (BOJ) — Policy Rate Decision',impact:'cb'},
];

// ── CLOCK ──
function startClock(){
  const tzEl=document.getElementById('calTzLabel');
  const clEl=document.getElementById('calClock');
  const offset=-new Date().getTimezoneOffset()/60;
  if(tzEl) tzEl.textContent=`GMT${offset>=0?'+':''}${offset}`;
  function tick(){ if(clEl) clEl.textContent=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false}); }
  tick(); setInterval(tick,1000);
}

// ── WEEK RANGE ──
function weekStart(offset=0){
  const today=new Date();
  const dow=today.getDay();
  const diffToMon=dow===0?-6:1-dow;
  const mon=new Date(today);
  mon.setDate(today.getDate()+diffToMon+(offset*7));
  mon.setHours(0,0,0,0);
  return mon;
}

function weekDays(offset=0){
  const mon=weekStart(offset);
  return Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return d; });
}

// ── FETCH ──
async function fetchCalendar(){
  const slug = weekOffset===1?'nextweek':weekOffset===-1?'lastweek':'thisweek';
  const cacheKey=`fxdesk_cal_${slug}`;
  setStatus('Loading…',false);

  try{
    const cached=JSON.parse(localStorage.getItem(cacheKey)||'null');
    if(cached&&(Date.now()-cached.ts)<CAL_TTL){ allEvents=cached.data; afterFetch(); return; }
  }catch(e){}

  const url=`${FF_BASE}${slug}.json`;
  let data=null;
  const SOURCES=[
    `${FX_PROXY}${encodeURIComponent(url)}`,                                      // own worker (with Referer fix)
    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,              // public CORS fallback
    `https://corsproxy.io/?${encodeURIComponent(url)}`,                           // second public fallback
    url,                                                                           // direct (fails with CORS, last resort)
  ];
  for(const src of SOURCES){
    try{
      const r=await Promise.race([fetch(src,{cache:'no-store'}),new Promise((_,rej)=>setTimeout(()=>rej('timeout'),10000))]);
      if(!r.ok) continue;
      const raw=await r.json();
      const arr=Array.isArray(raw)?raw:null;
      if(arr&&arr.length){ data=arr; break; }
    }catch(e){ data=null; }
  }

  if(data&&data.length){
    allEvents=data;
    try{ localStorage.setItem(cacheKey,JSON.stringify({ts:Date.now(),data})); }catch(e){}
    setStatus(`✓ ${data.length} events loaded · ${new Date().toLocaleTimeString()}`,false);
  } else {
    allEvents=[];
    setStatusRetry();
  }
  afterFetch();
}

function afterFetch(){
  // merge CB events
  const merged=[...allEvents,...CB_EVENTS];
  allEvents=merged;
  buildStrip();
  render();
}

function setStatus(msg,err){
  const el=document.getElementById('calStatusText');
  const bar=document.getElementById('calStatusBar');
  if(el) el.textContent=msg;
  if(bar) bar.className='cal-status-bar'+(err?' error':'');
}

function setStatusRetry(){
  const bar=document.getElementById('calStatusBar');
  if(!bar) return;
  bar.className='cal-status-bar error';
  bar.innerHTML=`<div class="error-retry-banner" style="width:100%;">⚠ Could not reach the calendar feed. It may be waking up — <button class='error-retry-btn' onclick='fetchCalendar()'>Retry</button></div>`;
}

// ── DATE STRIP ──
function buildStrip(){
  const strip=document.getElementById('dateStrip');
  if(!strip) return;
  const days=weekDays(weekOffset);
  const today=new Date(); today.setHours(0,0,0,0);

  // Count per day
  const counts={};
  allEvents.forEach(e=>{
    const d=new Date(e.date); d.setHours(0,0,0,0);
    const k=d.toDateString();
    if(!counts[k]) counts[k]={high:0,med:0,low:0,cb:0};
    const imp=(e.impact||'').toLowerCase();
    if(imp==='cb') counts[k].cb++;
    else if(imp==='high') counts[k].high++;
    else if(imp==='medium'||imp==='med') counts[k].med++;
    else counts[k].low++;
  });

  if(!selectedDate){
    const td=today.toDateString();
    selectedDate=days.some(d=>d.toDateString()===td)?td:days[1].toDateString();
  }

  strip.innerHTML=days.map(d=>{
    const ds=d.toDateString();
    const isToday=ds===today.toDateString();
    const isWeekend=d.getDay()===0||d.getDay()===6;
    const isActive=ds===selectedDate;
    const c=counts[ds]||{high:0,med:0,low:0,cb:0};
    const dots=[
      ...Array(Math.min(c.high,3)).fill('<div class="date-dot high"></div>'),
      ...Array(Math.min(c.cb,2)).fill('<div class="date-dot" style="background:#a855f7;"></div>'),
      ...Array(Math.min(c.med,2)).fill('<div class="date-dot med"></div>'),
    ].join('');
    const DOWS=['SUN','MON','TUE','WED','THU','FRI','SAT'];
    return `<div class="date-col${isActive?' active':''}${isWeekend?' weekend':''}${isToday?' today-col':''}"
      onclick="selectDate('${ds}')">
      <div class="date-col-month">${MONTHS[d.getMonth()]}</div>
      <div class="date-col-num">${d.getDate()}</div>
      ${isToday?'<div class="date-col-today-pill">TODAY</div>':`<div class="date-col-day">${DOWS[d.getDay()]}</div>`}
      <div class="date-dots">${dots}</div>
    </div>`;
  }).join('');
}

function selectDate(ds){
  selectedDate=ds;
  document.querySelectorAll('.date-col').forEach(b=>b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  render();
}

// ── VIEW / PERIOD ──
function setView(v,btn){
  currentView=v;
  document.querySelectorAll('.cal-view-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function quickNav(when,btn){
  document.querySelectorAll('.cal-nav-link').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const today=new Date(); today.setHours(0,0,0,0);
  if(when==='yesterday'){ const d=new Date(today); d.setDate(today.getDate()-1); selectedDate=d.toDateString(); }
  else if(when==='tomorrow'){ const d=new Date(today); d.setDate(today.getDate()+1); selectedDate=d.toDateString(); }
  else { selectedDate=today.toDateString(); }
  currentView='day';
  document.querySelectorAll('.cal-view-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.cal-view-btn')[1].classList.add('active');
  buildStrip(); render();
}

function loadPeriod(p,btn){
  weekOffset=p==='next'?1:p==='last'?-1:0;
  selectedDate=null;
  document.querySelectorAll('.cal-nav-link').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  fetchCalendar();
}

function shiftWeek(dir){
  weekOffset+=dir;
  selectedDate=null;
  fetchCalendar();
}

function toggleFilterPanel(){
  const p=document.getElementById('filterPanel');
  p.style.display=p.style.display==='none'?'block':'none';
}

function toggleImpact(imp,btn){
  if(activeImpact.has(imp)){
    if(activeImpact.size===1) return;
    activeImpact.delete(imp);
    btn.classList.remove('active');
  } else {
    activeImpact.add(imp);
    btn.classList.add('active');
  }
  render();
}

// ── RENDER ──
function render(){
  const el=document.getElementById('calEvents');
  if(!el) return;
  const impMap={high:'high',medium:'med',med:'med',low:'low',cb:'cb',''  :'low'};

  // Filter
  const visible=allEvents.filter(e=>{
    const imp=impMap[(e.impact||'').toLowerCase()]||'low';
    return activeImpact.has(imp);
  });

  // Get days to show
  const days=weekDays(weekOffset);
  let toShow=days;
  if(currentView==='day'){
    toShow=days.filter(d=>d.toDateString()===selectedDate);
    if(!toShow.length) toShow=[days.find(d=>d.toDateString()===selectedDate)||days[1]];
  }

  // Group by day
  const byDay={};
  visible.forEach(e=>{
    const d=new Date(e.date); d.setHours(0,0,0,0);
    const k=d.toDateString();
    if(!byDay[k]) byDay[k]=[];
    byDay[k].push(e);
  });

  let html='';
  toShow.forEach(day=>{
    const ds=day.toDateString();
    const evts=(byDay[ds]||[]).sort((a,b)=>new Date(a.date)-new Date(b.date));
    const highCnt=evts.filter(e=>e.impact==='high').length;
    const cbCnt=evts.filter(e=>e.impact==='cb').length;

    html+=`<div class="day-section">
      <div class="day-header-row">
        <div class="day-header-date-block">
          <div class="day-header-month-lbl">${MONTHS[day.getMonth()]}</div>
          <div class="day-header-day-num">${day.getDate()}</div>
        </div>
        <div class="day-header-name">${DAYS[day.getDay()]}${highCnt?` <span style="font-size:11px;font-family:var(--mono);color:#f87171;margin-left:10px;">${highCnt} HIGH</span>`:''}${cbCnt?` <span style="font-size:11px;font-family:var(--mono);color:#c084fc;margin-left:6px;">${cbCnt} CB</span>`:''}</div>
        <div class="day-col-hdr">IMPACT</div>
        <div class="day-col-hdr">ACTUAL</div>
        <div class="day-col-hdr">FORECAST</div>
        <div class="day-col-hdr">PREVIOUS</div>
      </div>`;

    if(!evts.length){
      html+=`<div style="padding:24px 20px;font-family:var(--sans);font-size:12px;color:var(--muted2);">No events match current filters for this day.</div>`;
    } else {
      evts.forEach(e=>{
        const imp=impMap[(e.impact||'').toLowerCase()]||'low';
        const flag=FLAGS[e.currency]||'🌐';
        const time=e.date?new Date(e.date).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true}):'All Day';
        let actClass='evt-num';
        if(e.actual&&e.forecast){
          const a=parseFloat(e.actual),f=parseFloat(e.forecast);
          if(!isNaN(a)&&!isNaN(f)) actClass='evt-num '+(a>=f?'better':'worse');
          else actClass='evt-num actual';
        } else if(e.actual) actClass='evt-num actual';
        const rowCls=imp==='high'?'high-row':imp==='cb'?'cb-row':imp==='med'?'med-row':'';
        const nameCls=imp==='cb'?'evt-name cb-name':'evt-name';
        const dotCls=imp;
        html+=`<div class="evt-row ${rowCls}">
          <div class="evt-time">${time}</div>
          <div class="evt-flag-cur"><span class="evt-flag">${flag}</span><span class="evt-cur">${e.currency||'—'}</span></div>
          <div class="${nameCls}">${e.title||'—'}</div>
          <div class="evt-impact-cell"><span class="imp-dot ${dotCls}"></span></div>
          <div class="${actClass} hide-m">${e.actual||'<span style="opacity:.3">—</span>'}</div>
          <div class="evt-num hide-m" style="color:var(--muted2);">${e.forecast||'<span style="opacity:.3">—</span>'}</div>
          <div class="evt-num hide-m" style="color:var(--muted);">${e.previous||'<span style="opacity:.3">—</span>'}</div>
        </div>`;
      });
    }
    html+='</div>';
  });

  if(!html) html='<div class="cal-empty">No events for this period.</div>';
  el.innerHTML=html;
}

// ── INIT ──
document.addEventListener('DOMContentLoaded',function(){
  startClock();
  fetchCalendar();
});
</script>

<!-- ── ENTRANCE: single-card fade-up (isolated; does not touch render/filter) ── -->
<script>
(function(){
  var card = document.querySelector('.cal-card.cal-reveal');
  if(!card) return;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce || !('IntersectionObserver' in window)){ card.classList.add('cal-revealed'); return; }
  var obs = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){ en.target.classList.add('cal-revealed'); obs.unobserve(en.target); }
    });
  }, { threshold: 0.06 });
  obs.observe(card);
})();
</script>
</body>
</html>
