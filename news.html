<style>
/* ===== Linear / Modern — news.html scoped redesign ===== */
:root{
  --lx-glass:linear-gradient(to bottom,rgba(255,255,255,.055),rgba(255,255,255,.02));
  --lx-bd:rgba(255,255,255,.06);
  --lx-bd-h:rgba(255,255,255,.10);
  --lx-bd-a:rgba(94,106,210,.30);
  --lx-accent:#5E6AD2;
  --lx-accent-h:#6872D9;
  --lx-card-sh:0 0 0 1px rgba(255,255,255,.06),0 2px 20px rgba(0,0,0,.4),0 0 40px rgba(0,0,0,.2);
  --lx-card-sh-h:0 0 0 1px rgba(255,255,255,.10),0 8px 40px rgba(0,0,0,.55),0 0 80px rgba(94,106,210,.12);
  --lx-ease:cubic-bezier(.16,1,.3,1);
}

/* Header */
.page-wrap .page-title{
  background:linear-gradient(180deg,#fff 0%,rgba(255,255,255,.70) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  letter-spacing:-.02em;
}
.page-wrap .page-sub{color:var(--muted);max-width:62ch}

/* Controls row */
.enews-controls{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 14px;align-items:center}

/* Search + select inputs */
.enews-input{
  background:#0F0F12;border:1px solid var(--lx-bd-h);color:var(--text);
  padding:10px 13px;border-radius:8px;font-family:var(--sans);font-size:13px;
  flex:1;min-width:160px;transition:border-color .2s var(--lx-ease),box-shadow .2s var(--lx-ease);
}
.enews-input::placeholder{color:var(--muted)}
.enews-input:focus{border-color:var(--lx-accent);outline:0;box-shadow:0 0 0 3px rgba(94,106,210,.22)}
/* search field with icon */
.enews-search-wrap{position:relative;flex:1;min-width:200px;display:flex}
.enews-search-wrap .enews-input{padding-left:36px;width:100%}
.enews-search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}
select.enews-input{flex:0;min-width:170px;cursor:pointer}

/* Pill filter / action button */
.port-btn{
  background:rgba(94,106,210,.12);color:var(--lx-accent-h);
  border:1px solid var(--lx-bd-a);padding:10px 18px;border-radius:9999px;
  font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;
  cursor:pointer;white-space:nowrap;transition:background .2s var(--lx-ease),border-color .2s var(--lx-ease),transform .2s var(--lx-ease);
}
.port-btn:hover{background:rgba(94,106,210,.22);border-color:var(--lx-accent);transform:translateY(-1px)}
.port-btn:active{transform:translateY(0)}

/* Status pill with pulsing dot */
.enews-status{
  display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;
  color:var(--muted);padding:8px 15px;background:var(--lx-glass);
  border:1px solid var(--lx-bd);border-radius:9999px;margin-bottom:18px;
  box-shadow:0 0 0 1px rgba(255,255,255,.04);transition:color .2s,border-color .2s;
}
.enews-status::before{
  content:"";width:8px;height:8px;border-radius:9999px;flex:none;
  background:var(--muted);box-shadow:0 0 0 0 rgba(138,143,152,.4);
}
.enews-status.success{color:var(--green);border-color:rgba(34,197,94,.30)}
.enews-status.success::before{background:#22C55E;animation:lx-pulse 2s var(--lx-ease) infinite}
.enews-status.error{color:#F87171;border-color:rgba(239,68,68,.30)}
.enews-status.error::before{background:#F87171}
@keyframes lx-pulse{
  0%{box-shadow:0 0 0 0 rgba(34,197,94,.45)}
  70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}
  100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}
}

/* ===== Bento feed grid ===== */
.enews-grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:768px){
  .enews-grid{grid-template-columns:repeat(6,1fr)}
  /* default: each card spans 2 of 6 cols -> 3-up */
  .enews-card{grid-column:span 2}
  /* featured lead article spans 4 cols (2/3 width) with side-by-side layout */
  .enews-card:first-child{grid-column:span 4}
  .enews-card:first-child .enews-img{height:240px}
  .enews-card:first-child .enews-title{font-size:19px}
}
@media(min-width:1100px){
  /* on wide screens the lead spans 3, plus a tall second feature */
  .enews-card:first-child{grid-column:span 3}
}

/* ===== Card glass ===== */
.enews-card{
  position:relative;background:var(--lx-glass);
  border:1px solid var(--lx-bd);border-radius:16px;padding:18px;cursor:pointer;
  display:flex;flex-direction:column;gap:10px;overflow:hidden;
  box-shadow:var(--lx-card-sh);
  transition:transform .25s var(--lx-ease),border-color .25s var(--lx-ease),box-shadow .25s var(--lx-ease);
}
/* top inner-glow line */
.enews-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);
  pointer-events:none;
}
.enews-card:hover{
  transform:translateY(-4px);border-color:var(--lx-bd-a);box-shadow:var(--lx-card-sh-h);
}
.enews-card-hdr{display:flex;justify-content:space-between;align-items:center;gap:10px}
.enews-source{
  font-family:var(--mono);font-size:9px;font-weight:700;padding:4px 9px;border-radius:9999px;
  background:rgba(94,106,210,.12);color:var(--lx-accent-h);border:1px solid var(--lx-bd-a);
  text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;
}
/* sentiment pill (JS emits .enews-sent + modifier class) */
.enews-sent{
  font-family:var(--mono);font-size:9px;font-weight:700;padding:4px 9px;border-radius:9999px;
  letter-spacing:.6px;white-space:nowrap;border:1px solid;
}
.enews-sent.pos{color:#4ADE80;background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.30)}
.enews-sent.neg{color:#F87171;background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.30)}
.enews-sent.neu{color:var(--lx-accent-h);background:rgba(94,106,210,.12);border-color:var(--lx-bd-a)}
.enews-img{
  width:100%;height:170px;object-fit:cover;border-radius:12px;
  border:1px solid var(--lx-bd);
}
.enews-title{font-family:var(--heading);font-size:15px;font-weight:600;color:var(--text);line-height:1.35;letter-spacing:-.01em}
.enews-summary{font-family:var(--sans);font-size:12.5px;color:var(--muted);line-height:1.6;flex:1}
.enews-footer{
  display:flex;justify-content:space-between;align-items:center;
  font-family:var(--mono);font-size:10px;color:var(--muted);
  padding-top:10px;border-top:1px solid var(--lx-bd);margin-top:2px;
}
.enews-footer .rd{color:var(--lx-accent-h);transition:color .2s var(--lx-ease)}
.enews-card:hover .enews-footer .rd{color:#fff}

/* ===== Empty / error states ===== */
.enews-empty{
  grid-column:1/-1;text-align:center;padding:64px 24px;font-family:var(--sans);font-size:13px;
  color:var(--muted);background:var(--lx-glass);border:1px solid var(--lx-bd);
  border-radius:16px;box-shadow:var(--lx-card-sh);
}
.enews-empty .ico{font-size:40px;margin-bottom:12px;opacity:.7}
.error-retry-banner{
  grid-column:1/-1;text-align:center;padding:40px 24px;font-family:var(--sans);font-size:13px;
  color:#F87171;background:var(--lx-glass);border:1px solid rgba(239,68,68,.30);
  border-radius:16px;box-shadow:var(--lx-card-sh);
}
.error-retry-btn{
  margin-left:6px;background:rgba(94,106,210,.12);color:var(--lx-accent-h);
  border:1px solid var(--lx-bd-a);padding:7px 16px;border-radius:9999px;
  font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;
  cursor:pointer;transition:background .2s var(--lx-ease),border-color .2s var(--lx-ease);
}
.error-retry-btn:hover{background:rgba(94,106,210,.22);border-color:var(--lx-accent)}

/* ===== Skeleton loading ===== */
.enews-skel{
  grid-column:span 2;background:var(--lx-glass);border:1px solid var(--lx-bd);
  border-radius:16px;padding:18px;min-height:220px;position:relative;overflow:hidden;
  box-shadow:var(--lx-card-sh);
}
.enews-skel::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);
  transform:translateX(-100%);animation:lx-shimmer 1.4s infinite;
}
@media(min-width:768px){.enews-skel:first-child{grid-column:span 4}}
@keyframes lx-shimmer{100%{transform:translateX(100%)}}

/* ===== Entrance animation ===== */
.lx-reveal{opacity:0;transform:translateY(16px)}
.lx-reveal.lx-in{opacity:1;transform:none;transition:opacity .6s var(--lx-ease),transform .6s var(--lx-ease)}

/* ===== A11y ===== */
.enews-input:focus-visible,.port-btn:focus-visible,.error-retry-btn:focus-visible,.enews-card:focus-visible{
  outline:2px solid rgba(94,106,210,.6);outline-offset:2px;
}
@media(prefers-reduced-motion:reduce){
  .enews-card,.port-btn,.enews-input{transition:none!important}
  .enews-status.success::before{animation:none}
  .enews-skel::after{animation:none}
  .lx-reveal{opacity:1;transform:none}
  .lx-reveal.lx-in{transition:none}
}

body.light-mode .enews-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.12)}

/* ── LIGHT MODE ── */

/* Page header */
body.light-mode .page-title { background-image: linear-gradient(to bottom,#09090B,rgba(9,9,11,.70)) !important; -webkit-background-clip:text !important; background-clip:text !important; color:transparent !important; }

/* Status pill */

/* Sentiment pills */

/* Search/filter inputs */
body.light-mode .enews-input { background: #FFFFFF !important; border-color: rgba(0,0,0,.12) !important; color: #09090B !important; }
body.light-mode .enews-input:focus { border-color: #4F46E5 !important; box-shadow: 0 0 0 3px rgba(79,70,229,.15) !important; }

/* Filter / refresh buttons */
body.light-mode .port-btn { background: rgba(0,0,0,.04) !important; border-color: rgba(0,0,0,.08) !important; color: #52525B !important; box-shadow: none !important; }

/* Bookmark button */
.bkmk-btn{background:none;border:none;cursor:pointer;font-size:14px;line-height:1;padding:3px 6px;border-radius:5px;transition:transform .15s,opacity .15s;opacity:.5;color:var(--muted)}
.bkmk-btn:hover{opacity:1;transform:scale(1.2)}

  <div class="page-wrap">
    <div class="page-title">📰 Economy News</div>
    <div class="page-sub">Aggregated financial &amp; economic news from 40,000+ sources. Powered by your Render backend.</div>
    <div class="enews-controls">
      <span class="enews-search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="enewsSearch" class="enews-input" aria-label="Search news articles" placeholder="Search articles...">
      </span>
      <select id="enewsCategory" class="enews-input" aria-label="News category">
        <option value="economy">Economy</option>
        <option value="finance">Finance</option>
        <option value="business">Business</option>
        <option value="markets">Markets</option>
        <option value="inflation">Inflation</option>
        <option value="interest rates">Interest Rates</option>
        <option value="cryptocurrency">Cryptocurrency</option>
        <option value="stocks">Stocks</option>
      </select>
      <button type="button" class="port-btn" onclick="fetchEconomyNews()">🔄 Refresh</button>
      <button type="button" class="port-btn" id="savedFilterBtn" onclick="toggleSavedFilter(this)">♥ Saved</button>
    </div>
    <div class="enews-status" id="enewsStatus">Loading news…</div>
    <div class="enews-grid" id="enewsFeed"></div>
  </div>
</main>
<script src="shared.js" defer></script>
<script>
const $=e=>document.getElementById(e);
function _fetchTimeout(e){return new Promise((t,n)=>setTimeout(()=>n(new Error("timeout")),e))}
const fmt=(e,t=2)=>null==e||isNaN(e)?"—":Number(e).toLocaleString("en-US",{minimumFractionDigits:t,maximumFractionDigits:t})
function timeAgo(e){const t=Math.round((Date.now()-e)/6e4);if(t<1)return"just now";if(t<60)return t+"m ago";const n=Math.round(t/60);return n<24?n+"h ago":Math.round(n/24)+"d ago"}
function localTs(e){return e?e.toLocaleString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit",timeZoneName:"short"}):"—"}
const ENEWS_BACKEND_URL='https://economy-news-hub.onrender.com';
const ENEWS_CACHE_KEY='fxdesk_enews_cache_v1';
const ENEWS_CACHE_TTL=10*60*1000;
const BOOKMARKS_KEY='fxdesk_bookmarks_v1';
let enewsArticles=[];
let enewsLoaded=false;
let showingSaved=false;

function getBookmarks(){try{return JSON.parse(localStorage.getItem(BOOKMARKS_KEY))||[];}catch(e){return[];}}
function saveBookmarks(bks){try{localStorage.setItem(BOOKMARKS_KEY,JSON.stringify(bks));}catch(e){}}
function isBookmarked(url){return getBookmarks().some(b=>b.url===url);}
function toggleBookmark(url,articleObj){
  let bks=getBookmarks();
  const idx=bks.findIndex(b=>b.url===url);
  if(idx>-1){bks.splice(idx,1);}else{bks.unshift(articleObj);}
  saveBookmarks(bks);
  document.querySelectorAll(`.bkmk-btn[data-url="${CSS.escape(url)}"]`).forEach(btn=>{btn.classList.toggle('saved',idx===-1);btn.title=idx===-1?'Remove bookmark':'Save article';});
  if(showingSaved)renderEconomyNews();
}
function toggleSavedFilter(btn){
  showingSaved=!showingSaved;
  btn.classList.toggle('saved-active',showingSaved);
  btn.textContent=showingSaved?'♥ All News':'♥ Saved';
  renderEconomyNews();
}

function populateNewsPage(){
  if(!enewsLoaded){ enewsLoaded=true; fetchEconomyNews(); }
}


const GOLD_BULL=['rate cut','stimulus','inflation','war','geopolitical','recession','dollar weakness','safe haven','uncertainty','crisis','dovish','easing','conflict','gold rallies','gold rises','gold surges','fed pivot','rate pause','slowdown','tariff','sanctions','debt ceiling','stagflation'];
const GOLD_BEAR=['rate hike','hawkish','strong economy','nfp beat','dollar strength','tightening','risk-on','stocks rally','gold falls','gold drops','gold declines','strong dollar','economic growth','jobs growth','resilient economy'];
function goldSentiment(title,desc){
  const t=((title||'')+(desc||'')).toLowerCase();
  let s=0;
  GOLD_BULL.forEach(w=>{if(t.includes(w))s++;});
  GOLD_BEAR.forEach(w=>{if(t.includes(w))s--;});
  if(s>0)return{label:'BULLISH',cls:'pos'};
  if(s<0)return{label:'BEARISH',cls:'neg'};
  return{label:'NEUTRAL',cls:'neu'};
}

async function fetchEconomyNews(){
  const status=$('enewsStatus'), feed=$('enewsFeed'), cat=$('enewsCategory');
  if(!status||!feed) return;
  const category=cat?cat.value:'economy';

  status.textContent='⏳ Loading news…';
  status.className='enews-status';

  try{
    const cached=JSON.parse(localStorage.getItem(ENEWS_CACHE_KEY)||'null');
    if(cached && cached.category===category && (Date.now()-cached.ts)<ENEWS_CACHE_TTL && cached.articles?.length){
      enewsArticles=cached.articles;
      status.textContent=`✓ Loaded ${enewsArticles.length} articles (cached) · ${localTs(new Date(cached.ts))}`;
      status.className='enews-status success';
      renderEconomyNews();
      return;
    }
  }catch(e){}

  try{
    const url=`${ENEWS_BACKEND_URL}/api/news?q=${encodeURIComponent(category)}&pageSize=50`;
    const r=await Promise.race([fetch(url,{cache:'no-store'}),_fetchTimeout(45000)]);
    const data=await r.json();
    if(data.status==='ok' && Array.isArray(data.articles)){
      enewsArticles=data.articles;
      status.textContent=`✓ Loaded ${enewsArticles.length} articles · ${localTs(new Date())}`;
      status.className='enews-status success';
      try{ localStorage.setItem(ENEWS_CACHE_KEY, JSON.stringify({ts:Date.now(),category,articles:enewsArticles})); }catch(e){}
      renderEconomyNews();
    } else {
      throw new Error(data.message||'Unexpected response');
    }
  }catch(e){
    status.textContent='❌ Could not reach the news server. It may be waking up from sleep (free hosting) — try Refresh again in ~30s.';
    status.className='enews-status error';
    feed.innerHTML=`<div class="error-retry-banner">⚠ Could not reach the news server. It may be waking up — <button class='error-retry-btn' onclick='fetchEconomyNews()'>Retry</button></div>`;
  }
}

function renderEconomyNews(){
  const feed=$('enewsFeed'), search=$('enewsSearch');
  if(!feed) return;
  const term=(search?.value||'').toLowerCase();
  let source=showingSaved?getBookmarks():enewsArticles;
  const filtered=source.filter(n=>n.title?.toLowerCase().includes(term)||n.description?.toLowerCase().includes(term));
  if(!filtered.length){
    const msg=showingSaved?'No saved articles yet. Click ♥ on any article to bookmark it.':'No articles found';
    feed.innerHTML=`<div class="enews-empty"><div class="ico">${showingSaved?'♥':'🔍'}</div><div>${msg}</div></div>`;
    return;
  }
  const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const safeUrl=u=>/^https?:\/\//i.test(u)?u:'#';
  feed.innerHTML=filtered.map(n=>{
    const dt=new Date(n.publishedAt);
    const imgSrc=safeUrl(n.urlToImage||'');
    const img=imgSrc&&imgSrc!=='#'?`<img src="${imgSrc}" alt="${esc(n.title?.substring(0,80)||'News article image')}" class="enews-img" loading="lazy" onerror="this.style.display='none'">`:'';
    const src=esc((n.source?.name||'Unknown').substring(0,30));
    const sent=goldSentiment(n.title,n.description);
    const href=safeUrl(n.url||'');
    const words=((n.title||'')+(n.description||'')).split(/\s+/).length;
    const readTime=Math.max(1,Math.ceil(words/200));
    const bkmkd=isBookmarked(n.url||'');
    const safeHref=href.replace(/'/g,'%27');
    const articleJson=esc(JSON.stringify({url:n.url,title:n.title,description:n.description,source:n.source,publishedAt:n.publishedAt,urlToImage:n.urlToImage}));
    return `<article class="enews-card lx-reveal" tabindex="0" role="link" aria-label="${esc(n.title?.substring(0,120)||'News article')}" onclick="window.open('${safeHref}','_blank','noopener noreferrer')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.open('${safeHref}','_blank','noopener noreferrer')}">
      ${img}
      <div class="enews-card-hdr"><span class="enews-source">${src}</span><span class="enews-sent ${sent.cls}">⬤ ${sent.label}</span><button class="bkmk-btn${bkmkd?' saved':''}" data-url="${esc(n.url||'')}" title="${bkmkd?'Remove bookmark':'Save article'}" aria-label="${bkmkd?'Remove bookmark':'Save article'}" onclick="event.stopPropagation();toggleBookmark(this.dataset.url,${articleJson})">♥</button></div>
      <div class="enews-title">${esc(n.title||'')}</div>
      <div class="enews-summary">${esc(n.description||'No description available')}</div>
      <div class="enews-footer"><span>📅 ${isNaN(dt)?'—':timeAgo(dt)}</span><span class="enews-read-time">${readTime} min read</span><span class="rd">Read full story →</span></div>
    </article>`;
  }).join('');
  lxObserveCards();
}

if($('enewsSearch')){let _st;$('enewsSearch').addEventListener('input',function(){clearTimeout(_st);_st=setTimeout(renderEconomyNews,200);});}
if($('enewsCategory')) $('enewsCategory').addEventListener('change', fetchEconomyNews);

/* Entrance reveal — runs after each render; observes newly added cards once, staggered. */
let _lxObs=null;
function lxObserveCards(){
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  const cards=document.querySelectorAll('#enewsFeed .enews-card.lx-reveal');
  if(reduce||!('IntersectionObserver'in window)){cards.forEach(c=>c.classList.add('lx-in'));return;}
  if(!_lxObs){
    _lxObs=new IntersectionObserver((entries,obs)=>{
      entries.forEach(en=>{
        if(en.isIntersecting){
          const el=en.target;
          const i=Array.prototype.indexOf.call(el.parentNode.children,el);
          el.style.transitionDelay=Math.min(i,8)*60+'ms';
          el.classList.add('lx-in');
          obs.unobserve(el);
        }
      });
    },{threshold:0.15});
  }
  cards.forEach(c=>{if(!c.classList.contains('lx-in'))_lxObs.observe(c);});
}
