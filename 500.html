<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>500 — Server Error · Forex Desk</title>
<meta name="description" content="Something went wrong on our end. Head back to the Forex Desk trading dashboard.">
<meta name="theme-color" content="#04080F">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=5">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#04080F;--bg2:#0F1A28;--text:#E2EAF4;--muted:#6A86A0;--border:#1A2A3D;--red:#EF4444;--gold:#C9A84C;--blue:#3B82F6}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px;text-align:center}
.code{font-size:96px;font-weight:900;line-height:1;color:var(--red);opacity:.25;font-variant-numeric:tabular-nums}
.title{font-size:28px;font-weight:800;letter-spacing:-0.5px;margin-top:-16px}
.sub{font-size:15px;color:var(--muted);line-height:1.6;max-width:380px}
.links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.btn{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;padding:10px 22px;border-radius:8px;font-size:14px;font-weight:600;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn.sec{background:var(--bg2);color:var(--text);border:1px solid var(--border)}
.gold{color:var(--gold)}
</style>
</head>
<body>
<div class="code">500</div>
<div class="title">Something went wrong</div>
<p class="sub">We hit an unexpected error on our end. This is on us — please try again in a moment.</p>
<div class="links">
  <a href="dashboard.html" class="btn">Back to Dashboard</a>
  <a href="javascript:location.reload()" class="btn sec">Retry</a>
</div>
<p style="font-size:11px;color:var(--muted);margin-top:24px"><span class="gold">FOREX DESK</span> · Professional Trading Command Center</p>
</body>
</html>
