<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — Forex Desk</title>
<meta name="theme-color" content="#04080F">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=5">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#050506;--bg2:#0a0a0c;--bg3:#101014;--text:#EDEDEF;--muted:#8A8F98;--border:#1c1d24;--gold:#5E6AD2;--blue:#5E6AD2;--mono:'Courier New',monospace}
html{background:#050506!important}
.lx-blob{position:fixed;border-radius:50%;z-index:-1;pointer-events:none;will-change:transform;transform:translateZ(0)}
.lx-blob.b1{top:-220px;left:50%;width:1000px;height:1000px;margin-left:-500px;background:radial-gradient(circle,rgba(94,106,210,.22),transparent 70%);filter:blur(55px);animation:lxf1 9s ease-in-out infinite}
.lx-blob.b2{top:24%;left:-160px;width:650px;height:800px;background:radial-gradient(circle,rgba(139,92,246,.15),transparent 70%);filter:blur(45px);animation:lxf2 11s ease-in-out infinite}
.lx-blob.b3{top:14%;right:-140px;width:560px;height:720px;background:radial-gradient(circle,rgba(80,120,220,.12),transparent 70%);filter:blur(40px);animation:lxf3 10s ease-in-out infinite}
.lx-blob.b4{bottom:-220px;left:50%;width:760px;height:520px;margin-left:-380px;background:radial-gradient(circle,rgba(94,106,210,.10),transparent 70%);filter:blur(50px);animation:lxpulse 8s ease-in-out infinite}
@keyframes lxf1{0%,100%{transform:translateZ(0) translateY(0)}50%{transform:translateZ(0) translateY(-26px)}}
@keyframes lxf2{0%,100%{transform:translateZ(0) translateY(0) rotate(0)}50%{transform:translateZ(0) translateY(-22px) rotate(1deg)}}
@keyframes lxf3{0%,100%{transform:translateZ(0) translateY(0) rotate(0)}50%{transform:translateZ(0) translateY(-30px) rotate(-1deg)}}
@keyframes lxpulse{0%,100%{opacity:.45;transform:translateZ(0) scale(1)}50%{opacity:.7;transform:translateZ(0) scale(1.06)}}
@media(prefers-reduced-motion:reduce){.lx-blob{animation:none!important}}
@media(max-width:780px){.lx-blob.b2,.lx-blob.b3{display:none}}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px;text-align:center}
.icon{font-size:64px;line-height:1}
.title{font-size:28px;font-weight:800;letter-spacing:-0.5px}
.sub{font-size:15px;color:var(--muted);line-height:1.6;max-width:380px}
.gold{color:var(--gold)}
.badge{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 20px;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px}
.links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.btn{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;padding:10px 22px;border-radius:8px;font-size:14px;font-weight:600;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn.sec{background:var(--bg2);color:var(--text);border:1px solid var(--border)}
</style>
</head>
<body>
<div class="lx-blob b1" aria-hidden="true"></div>
<div class="lx-blob b2" aria-hidden="true"></div>
<div class="lx-blob b3" aria-hidden="true"></div>
<div class="lx-blob b4" aria-hidden="true"></div>
<div class="icon">📡</div>
<div class="title"><span class="gold">FOREX</span> DESK</div>
<p class="sub">You're currently offline. Your previously loaded data and trades are still available from the local cache.</p>
<div class="badge">No internet connection detected</div>
<div class="links">
  <a href="dashboard.html" class="btn">Open Dashboard</a>
  <a href="journal.html" class="btn sec">Trade Journal</a>
  <a href="portfolio.html" class="btn sec">Portfolio</a>
</div>
<p style="font-size:11px;color:var(--muted);margin-top:16px">Live prices and news require a connection · Cached data will be used where available</p>
<script>
window.addEventListener('online', function(){ window.location.reload(); });
</script>
</body>
</html>
