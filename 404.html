<style>
.not-found {
  min-height: calc(100vh - 64px - 80px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 60px 24px;
  position: relative;
  overflow: hidden;
}

.not-found::before {
  content: '404';
  position: absolute;
  font-family: var(--display);
  font-size: clamp(160px, 30vw, 300px);
  font-weight: 900;
  color: rgba(94,106,210,.04);
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  pointer-events: none;
  letter-spacing: -10px;
  white-space: nowrap;
}

.nf-code {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 3px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 16px;
}

.nf-title {
  font-family: var(--display);
  font-size: clamp(28px, 5vw, 52px);
  font-weight: 900;
  letter-spacing: -1.5px;
  color: var(--text);
  margin-bottom: 16px;
  line-height: 1.05;
}

.nf-desc {
  font-family: var(--sans);
  font-size: 15px;
  color: var(--muted2);
  max-width: 400px;
  line-height: 1.7;
  margin-bottom: 40px;
}

.nf-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}

.nf-links {
  margin-top: 48px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}

.nf-link {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .8px;
  text-transform: uppercase;
  color: var(--muted2);
  text-decoration: none;
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  transition: color .2s, border-color .2s;
}
.nf-link:hover { color: var(--text); border-color: var(--muted); }
</style>
